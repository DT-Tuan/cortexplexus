# CortexPlexus — 2 containers, nothing more
# Usage: docker compose up -d
#
# Images are pre-built and published to GitHub Container Registry.
# No source code or build tools needed — just this file + .env.

services:
  postgres:
    image: ghcr.io/dt-tuan/cortexplexus-postgres:main
    restart: unless-stopped   # survive host reboot (LXC has no compose autostart otherwise)
    # To build from source instead: comment out 'image' and uncomment 'build':
    # build:
    #   context: ./docker/postgres
    #   dockerfile: Dockerfile
    environment:
      POSTGRES_DB: cortexplexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cortexplexus
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  cortexplexus:
    image: ghcr.io/dt-tuan/cortexplexus:main
    restart: unless-stopped   # survive host reboot (LXC has no compose autostart otherwise)
    # To build from source instead: comment out 'image' and uncomment 'build':
    # build:
    #   context: .
    #   dockerfile: src/CortexPlexus.App/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=cortexplexus;Username=postgres;Password=cortexplexus
      - Embedding__Provider=${EMBEDDING_PROVIDER:-ollama}
      - Embedding__ApiKey=${GEMINI_API_KEY:-}
      - Embedding__OllamaBaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Vertex AI provider (ADR-017) — only consulted when EMBEDDING_PROVIDER=vertex.
      # Values (incl. the API key) live in the gitignored .env, never committed.
      - Embedding__VertexProjectId=${VERTEX_PROJECT_ID:-}
      - Embedding__VertexLocation=${VERTEX_LOCATION:-us-central1}
      - Embedding__VertexModelId=${VERTEX_MODEL_ID:-text-embedding-005}
      - Embedding__VertexApiKey=${VERTEX_API_KEY:-}
      # ADR-029 — OAuth2 service-account auth. Set VERTEX_CREDENTIAL_PATH to the
      # CONTAINER path of the mounted key file (see the volume below) on an account
      # that has no express-mode key. Leave both this and VERTEX_API_KEY empty to
      # fall back to Application Default Credentials.
      - Embedding__VertexCredentialPath=${VERTEX_CREDENTIAL_PATH:-}
      - Embedding__VertexInstancesPerCall=${VERTEX_INSTANCES_PER_CALL:-5}
      - Workspace__Path=/workspace
    volumes:
      - ${WORKSPACE_PATH:-.}:/workspace
      - appdata:/app/data
      # For ADR-029 OAuth2, add the service-account key as a READ-ONLY bind mount
      # in docker-compose.override.yml (not here — it is deployment-specific, and
      # compose has no conditional volume). Never bake it into the image: layers
      # are immutable, so a credential added in one layer stays recoverable from
      # image history even if a later layer deletes it.
      #   - ~/.config/gcp/vertex-sa.json:/etc/gcp/sa.json:ro
      # then set VERTEX_CREDENTIAL_PATH=/etc/gcp/sa.json in .env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
